name: Hotfix Deployment

on:
  push:
    branches:
      - 'hotfix/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-hotfix:
    name: Validate Hotfix
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction
      
      - name: Run tests
        run: php artisan test
      
      - name: Security scan
        run: composer audit

  create-pr:
    name: Create Hotfix PR
    runs-on: ubuntu-latest
    needs: validate-hotfix
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create Pull Request to main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          base: main
          title: "🔥 Hotfix: ${{ github.ref_name }}"
          body: |
            ## Hotfix Deployment
            
            **Branch:** `${{ github.ref_name }}`
            
            This is an automated hotfix PR. Please review and merge to deploy to production.
            
            ### Checklist
            - [ ] Tests passing
            - [ ] Security scan passed
            - [ ] Changes reviewed
            - [ ] Deployment approved
          labels: hotfix,priority-high

  expedited-deploy:
    name: Expedited Staging Deploy
    runs-on: ubuntu-latest
    needs: validate-hotfix
    environment:
      name: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging for testing
        run: echo "Deploy hotfix to staging for immediate testing"
