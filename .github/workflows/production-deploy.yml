name: Production Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      
      - name: Run tests with coverage
        run: php artisan test --coverage --min=70
      
      - name: Security audit
        run: composer audit --locked
      
      - name: Check for migrations
        id: migrations
        run: |
          if git diff HEAD~1 --name-only | grep -q "database/migrations"; then
            echo "has_migrations=true" >> $GITHUB_OUTPUT
          else
            echo "has_migrations=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml

  migration-approval:
    name: Migration Approval Gate
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    if: needs.pre-deployment-checks.outputs.has_migrations == 'true'
    environment:
      name: migration-approval
    
    steps:
      - name: Wait for approval
        run: echo "Migration changes detected. Manual approval required."

  build-artifact:
    name: Build Deployment Artifact
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
      
      - name: Install production dependencies
        run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Build assets
        run: npm run build
      
      - name: Create deployment package
        run: |
          mkdir -p deploy-artifact
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='tests' \
            --exclude='storage/logs/*' --exclude='.env*' . deploy-artifact/
      
      - name: Generate SBOM
        run: |
          composer show --format=json > deploy-artifact/sbom-composer.json
          npm list --json > deploy-artifact/sbom-npm.json || true
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: deploy-artifact/
          retention-days: 30

  deploy-production:
    name: Deploy to IONOS Production
    runs-on: ubuntu-latest
    needs: [build-artifact, migration-approval]
    if: always() && needs.build-artifact.result == 'success'
    environment:
      name: production
      url: https://pds.gov.ph
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: deployment-package
          path: deployment/
      
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_KEY }}
      
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.IONOS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Enable maintenance mode
        run: |
          ssh ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "cd ${{ secrets.IONOS_PATH }} && php artisan down --retry=60"
      
      - name: Backup current deployment
        run: |
          ssh ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "cd ${{ secrets.IONOS_PATH }}/.. && \
             tar -czf backup-$(date +%Y%m%d-%H%M%S).tar.gz $(basename ${{ secrets.IONOS_PATH }})"
      
      - name: Deploy files
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='storage/app/*' \
            --exclude='storage/logs/*' \
            --exclude='bootstrap/cache/*' \
            deployment/ ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }}:${{ secrets.IONOS_PATH }}/
      
      - name: Run migrations
        run: |
          ssh ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "cd ${{ secrets.IONOS_PATH }} && php artisan migrate --force"
      
      - name: Clear caches
        run: |
          ssh ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "cd ${{ secrets.IONOS_PATH }} && \
             php artisan config:cache && \
             php artisan route:cache && \
             php artisan view:cache"
      
      - name: Disable maintenance mode
        run: |
          ssh ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "cd ${{ secrets.IONOS_PATH }} && php artisan up"
      
      - name: Run smoke tests
        run: |
          sleep 10
          curl -f https://pds.gov.ph/health || exit 1

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure()
    
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.IONOS_SSH_KEY }}
      
      - name: Restore backup
        run: |
          ssh ${{ secrets.IONOS_USER }}@${{ secrets.IONOS_HOST }} \
            "cd ${{ secrets.IONOS_PATH }}/.. && \
             LATEST_BACKUP=\$(ls -t backup-*.tar.gz | head -1) && \
             tar -xzf \$LATEST_BACKUP && \
             php ${{ secrets.IONOS_PATH }}/artisan up"
      
      - name: Notify team
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Deployment Failed** - Automatic rollback completed'
            })
