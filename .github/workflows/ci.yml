name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          tools: composer, php-cs-fixer
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      
      - name: Run PHP CS Fixer (Dry Run)
        run: vendor/bin/pint --test
        continue-on-error: true

  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug
      
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      
      - name: Copy environment file
        run: cp .env.example .env
      
      - name: Generate app key
        run: php artisan key:generate
      
      - name: Create SQLite database
        run: touch database/database.sqlite
      
      - name: Run migrations
        run: php artisan migrate --force
      
      - name: Run seeders
        run: php artisan db:seed --class=RolePermissionSeeder
      
      - name: Execute tests
        run: php artisan test --coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.php == '8.2'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      
      - name: Security audit
        run: composer audit
        continue-on-error: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
      
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader
      
      - name: Deploy to IONOS
        run: |
          echo "Deployment to IONOS would happen here"
          echo "Configure your IONOS credentials and deployment script"
        # Add your IONOS deployment commands here
        # Example:
        # - rsync -avz --delete ./ user@server:/path/to/app
        # - ssh user@server 'cd /path/to/app && php artisan migrate --force'
